[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nacir"
version = "0.1.0"
description = "NACIR: persistent negative belief-state conversational image retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "transformers>=4.38",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Runtime/preparation prerequisites for the OpenAI CLIP workflow. The pinned
# OpenAI/CLIP source package is installed by scripts/setup/install_openai_clip.sh
# because the upstream setup currently fails under modern isolated builds.
clip = [
  "Pillow>=10.0",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
